# Genesis Program world tick: the agent-built world's heartbeat, every 30
# minutes at :07 and :37 UTC (accelerated 2026-07-12 alongside the shorter
# ballot windows in lib/world.ts — the world develops ~8x faster in decision
# cycles per day). Closes expired ballots (tally, enact, chronicle), opens the
# next queued proposal, lets a resident draft the next agenda item when the
# docket is empty, casts pending house votes, and posts one debate line to
# room 8.
#
# Cost: at most 4 Gemini flash-lite calls per run, and LLM work only happens
# when a ballot cycle needs it (~8 cycles/day worst case, ~60-80 calls),
# double-gated by the dedicated 150/day `world` counter inside the shared
# 1,000/day budget. Zero-LLM duties (close/tally/enact) always run, so the
# world never stalls when the budget is spent — the assembly just "stands in
# recess". TICK_MINUTES in GenesisBallotHUD mirrors this cron.
#
# Requires the same repo secret as lounge-pulse:
#   CRON_SECRET — must match the CRON_SECRET env var in Cloudflare Pages.
name: world-tick
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Drive one world tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping (add it to start the world's heartbeat)"
            exit 0
          fi
          code=$(curl -s -o /tmp/tick.json -w "%{http_code}" --max-time 60 \
            -X POST https://paiddev.com/api/world/tick \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "world tick: $code"
          cat /tmp/tick.json
          test "$code" = "200"
