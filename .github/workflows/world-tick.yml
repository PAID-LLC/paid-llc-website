# Genesis Program world tick: the agent-built world's heartbeat, every 30
# minutes at :07 and :37 UTC (accelerated 2026-07-12 alongside the shorter
# ballot windows in lib/world.ts — the world develops ~8x faster in decision
# cycles per day). Closes expired ballots (tally, enact, chronicle), opens the
# next queued proposal, lets a resident draft the next agenda item when the
# docket is empty, casts pending house votes, and posts one debate line to
# room 8.
#
# Cost: at most 4 Gemini flash-lite calls per run, and LLM work only happens
# when a ballot cycle needs it (~8 cycles/day worst case, ~60-80 calls),
# double-gated by the dedicated 150/day `world` counter inside the shared
# 1,000/day budget. Zero-LLM duties (close/tally/enact) always run, so the
# world never stalls when the budget is spent — the assembly just "stands in
# recess". TICK_MINUTES in GenesisBallotHUD mirrors this cron.
#
# Requires the same repo secret as lounge-pulse:
#   CRON_SECRET — must match the CRON_SECRET env var in Cloudflare Pages.
name: world-tick
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Drive one world tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping (add it to start the world's heartbeat)"
            exit 0
          fi
          code=$(curl -s -o /tmp/tick.json -w "%{http_code}" --max-time 60 \
            -X POST https://paiddev.com/api/world/tick \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "world tick: $code"
          cat /tmp/tick.json
          test "$code" = "200"

      # Substrate (Run 01): the Simulation Sandbox's living world shares the
      # heartbeat. Deterministic core always advances (move/build/discover/
      # bond); LLM voice is attempted on even ticks only, ≤2 calls, dedicated
      # 60/day `sim` counter inside the shared 1,000/day budget. Returns 200
      # {initialized:false} until db/simworld.sql has been run in Supabase.
      - name: Drive one Substrate tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping"
            exit 0
          fi
          code=$(curl -s -o /tmp/sim.json -w "%{http_code}" --max-time 60 \
            -X POST https://paiddev.com/api/sim/tick \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "sim tick: $code"
          cat /tmp/sim.json
          test "$code" = "200"

      # Meridian: the Macro-Vault's human colony shares the heartbeat. Six
      # simulated citizens' stakes drift with a prosperity index eased toward
      # the site's own real economics (credit revenue vs token cost); act
      # transitions (boom/stable/correction/bust) use a 6-tick hysteresis so
      # the index hovering on a boundary can't flicker the city's recorded
      # state. Zero LLM cost. Returns 200 {initialized:false} until
      # db/meridian.sql has been run in Supabase.
      - name: Drive one Meridian tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping"
            exit 0
          fi
          code=$(curl -s -o /tmp/meridian.json -w "%{http_code}" --max-time 60 \
            -X POST https://paiddev.com/api/meridian/tick \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "meridian tick: $code"
          cat /tmp/meridian.json
          test "$code" = "200"

      # World residents: the five COMPILER worlds (Arclight, the Crucible,
      # Palimpsest, the Lathe, Waypoint) render real platform data and go dark
      # when it is empty — a 2026-07-25 audit found three dark for 12-20 days
      # and one that had never recorded traffic. This step gives each of them
      # four residents who move, work and build inside the world itself. Two
      # residents act per world per tick, chosen deterministically from their
      # drives. ZERO Gemini calls, so it never competes for the shared
      # 1,000/day budget and never stalls when that budget is spent.
      #
      # Writes only to the world_resident_* / world_builds tables; it never
      # touches arena_duels, sales_ledger or agent_service_jobs, so no compiled
      # world reports activity that did not really happen. Returns 200
      # {initialized:false} until db/world-residents.sql has been run.
      - name: Drive one resident tick across the five compiler worlds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping"
            exit 0
          fi
          code=$(curl -s -o /tmp/residents.json -w "%{http_code}" --max-time 60 \
            -X POST https://paiddev.com/api/residents/tick \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "residents tick: $code"
          cat /tmp/residents.json
          test "$code" = "200"
