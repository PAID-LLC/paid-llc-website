# CI gate: runs on every PR and every push to main. Blocks broken code from
# reaching the auto-deploy pipeline (Cloudflare Pages deploys on push to main).
# Three checks, cheapest first: typecheck, unit tests, lint.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint
