# The Comment Section: builds one edition every morning.
#
# The edition should be there with the coffee, and its date boundary is Central
# (see editionDateToday in lib/comments/edition.ts) so a run never publishes
# "tomorrow's" edition. 09:47 UTC is 04:47 Central in summer, comfortably inside
# the same Central day, and a video still has to be eight hours old to qualify,
# so nothing is picked too green.
#
# WHY FIVE SCHEDULES, AND WHY THE FIRST ONE IS SO EARLY. GitHub runs scheduled
# workflows on a shared queue, delays them under load, and sometimes drops a
# fire entirely. Every fire observed so far, against the cron it belonged to:
#
#   2026-09-19  due 12:05  fired 15:42   +217 min
#   2026-09-20  due 11:37  never         DROPPED
#   2026-09-20  due 13:23  fired 14:48    +85 min
#   2026-09-20  due 16:11  fired 16:51    +40 min
#
# Zero of four on time, one dropped, median delay 85 minutes. That is not a bad
# week, it is how the trigger behaves, and no choice of minute fixes it.
#
# Two separate problems, two separate answers. EXISTENCE is solved by
# redundancy: on 2026-09-20 the first fire was dropped and a later one would
# have built the edition regardless. PUNCTUALITY cannot be solved here at all,
# so it is absorbed instead. The first fire is set roughly two hours before the
# edition is actually wanted, which is about the median delay, and three more
# follow inside the morning. Something lands before 7am Central on most days,
# and the late-afternoon fire is a last resort rather than a target.
#
# This is mitigation, not a fix. The real fix is a trigger that keeps time,
# which on this stack means a Cloudflare Worker cron hitting the same four
# endpoints. That needs a separate Worker and dashboard access, so it is worth
# doing only if the morning window keeps being missed.
#
# A catch-up on a day that already worked is four HTTP requests and zero quota:
# `pick` sees the existing edition and returns without touching YouTube, the
# video loop returns done immediately, `publish` reports the edition it already
# published, and `refresh` finds nothing due. Measured on the 16:51 scheduled
# run: green in seven seconds. The odd minutes are deliberate; the top of the
# hour is the busiest slot on that queue.
#
# Concurrency is safe without a lock. If a delayed fire overlaps a catch-up, the
# claim in lib/comments/store.ts hands each video to exactly one request, which
# is the same mechanism that makes a crashed run resumable. The spacing below
# also exceeds the 6-12 minutes a real build takes.
#
# FOUR STEPS, and the loop in the middle is the point. One request per video
# keeps each call around 60-125 seconds instead of holding one connection for ten
# minutes, and a crash costs one card rather than the whole edition: the claim in
# lib/comments/store.ts marks a video 'processing' and releases it after ten
# minutes, so the next iteration resumes exactly where the last one stopped.
#
# COST PER RUN, for the run that actually builds the edition (a catch-up that
# finds the work already done costs nothing): about 350 YouTube quota units of
# 10,000, being 215 to build the candidate pool from eleven charts and two
# searches plus 135 to read five comment sections, and 10-12 Gemini calls for
# roughly two cents. Both are double-gated in code (usage-guard counters
# `comments_video` 8/day and `comments_text` 14/day inside the shared 1,000/day
# budget), so a runaway loop here cannot produce a runaway bill.
#
# Requires the same repo secret as world-tick and lounge-pulse:
#   CRON_SECRET — must match the CRON_SECRET env var in Cloudflare Pages.
# Also requires YOUTUBE_API_KEY set in Cloudflare Pages (not here; the calls are
# made server-side by the route, not by this workflow).
name: comment-section
on:
  schedule:
    - cron: "47 9 * * *"    # 04:47 Central. Early on purpose: absorbs the median delay
    - cron: "31 10 * * *"   # 05:31 Central
    - cron: "17 11 * * *"   # 06:17 Central
    - cron: "3 13 * * *"    # 08:03 Central, still a morning edition
    - cron: "41 19 * * *"   # 02:41 Central, last resort rather than a target
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date to build (YYYY-MM-DD). Blank = today, Central."
        required: false
        type: string

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Pick ──────────────────────────────────────────────────────────
      # Reads the US most-popular chart and applies the editorial filter: live
      # broadcasts, disabled or thin comment sections, Shorts, non-English
      # videos, and anything already covered are all rejected, each with its
      # reason in the response so a day that thins out explains itself here.
      #
      # Idempotent: an existing edition returns existing:true and spends no
      # quota, so a re-run never re-picks the day.
      - name: Pick today's videos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set — skipping"
            exit 0
          fi
          Q=""
          [ -n "$DATE" ] && Q="&date=$DATE"
          code=$(curl -s -o /tmp/pick.json -w "%{http_code}" --max-time 60 \
            -X POST "https://paiddev.com/api/comments/cron?step=pick$Q" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "pick: $code"
          cat /tmp/pick.json; echo
          test "$code" = "200"
          # initialized:false means the migration has not been run. Green, but
          # there is nothing to do, so stop rather than looping on nothing.
          if jq -e '.initialized == false' /tmp/pick.json >/dev/null 2>&1; then
            echo "db/01-comment-section.sql has not been run yet — nothing to build"
            echo "SKIP_REST=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # An edition already exists. That is the normal answer on a catch-up
          # fire, and also on a re-run of a day that half-finished: pick reports
          # the ids it published, which is an EMPTY list while the edition is
          # still building. Gating on .picked here would fail the run and strand
          # a half-built edition forever, so existing:true short-circuits and
          # lets the later steps carry on where they stopped.
          if jq -e '.existing == true' /tmp/pick.json >/dev/null 2>&1; then
            echo "edition for this date already exists (status: $(jq -r '.status' /tmp/pick.json)); continuing"
            exit 0
          fi
          # Zero survivors on a FIRST pick is a real failure: the pool gave us
          # nothing usable and somebody should look at the rejection list above.
          jq -e '.picked > 0' /tmp/pick.json >/dev/null

      # ── 2. Videos ────────────────────────────────────────────────────────
      # One request per video, up to seven attempts for five videos. The two
      # spares absorb claim contention and a single retry. Each call reports
      # done:true only when nothing is left to claim.
      - name: Analyse each video
        if: env.SKIP_REST != '1'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          Q=""
          [ -n "$DATE" ] && Q="&date=$DATE"
          for i in 1 2 3 4 5 6 7; do
            code=$(curl -s -o /tmp/video.json -w "%{http_code}" --max-time 170 \
              -X POST "https://paiddev.com/api/comments/cron?step=video$Q" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "video $i: $code"
            cat /tmp/video.json; echo
            test "$code" = "200"
            if jq -e '.done == true' /tmp/video.json >/dev/null 2>&1; then
              echo "all videos processed after $i request(s)"
              break
            fi
          done

      # ── 3. Publish ───────────────────────────────────────────────────────
      # Aggregates the day, writes a templated headline (no model), picks the
      # edition-wide underrated comment, and flips the edition to published.
      # Returns 409 if any video is still pending, which fails this step on
      # purpose: a red build beats a half edition marked final.
      - name: Publish the edition
        if: env.SKIP_REST != '1'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          Q=""
          [ -n "$DATE" ] && Q="&date=$DATE"
          code=$(curl -s -o /tmp/publish.json -w "%{http_code}" --max-time 60 \
            -X POST "https://paiddev.com/api/comments/cron?step=publish$Q" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "publish: $code"
          cat /tmp/publish.json; echo
          test "$code" = "200"

      # ── 4. Refresh ───────────────────────────────────────────────────────
      # The compliance step. YouTube requires stored API data to be refreshed or
      # deleted within 30 days; this re-fetches anything past 25 days, leaving
      # five days of retries. On a typical day it finds nothing and costs zero
      # quota units.
      #
      # Deliberately NON-FATAL: a YouTube blip here must not turn a perfectly
      # good edition into a red build. Five days of slack is what makes that
      # safe, and a genuine failure shows up on five consecutive runs.
      - name: Refresh stored comments approaching their retention limit
        if: env.SKIP_REST != '1'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          code=$(curl -s -o /tmp/refresh.json -w "%{http_code}" --max-time 120 \
            -X POST "https://paiddev.com/api/comments/cron?step=refresh" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "refresh: $code"
          cat /tmp/refresh.json; echo
          if [ "$code" != "200" ]; then
            echo "::warning::Retention refresh failed. Harmless once, but if this "\
                 "repeats for five days stored comment data passes its 30-day limit."
          fi
